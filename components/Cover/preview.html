<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>areeba Asterisk 4</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-sunken); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--brand); }
  .night { fill:var(--night); }
  .raised { fill:var(--surface-raised); }
  .accent { fill:var(--accent); }
  .pill-ground { fill:var(--on-night); }
  .pill-brand { fill:var(--brand); }
  .wave { fill:none; stroke:var(--on-brand); stroke-width:6; stroke-linecap:round; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .eyebrow { display:flex; align-items:center; gap:var(--space-3); margin:0 0 var(--space-3) 4px; font-size:16px; line-height:24px; font-weight:600; color:var(--ink); }
  .mark { display:block; width:40px; height:40px; }
  .mark .petal { stroke:var(--brand); stroke-width:6; stroke-linecap:round; }
  .mark .spark { stroke:var(--accent); stroke-width:6; stroke-linecap:round; }
  .name { margin:0; font-size:96px; line-height:.92; font-weight:500; letter-spacing:-.04em; color:var(--ink); white-space:nowrap; }
  .tag { margin:var(--space-3) 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
  /* Dark mode: brand flips to Chalk for buttons, but the cover keeps its Crimson slab (on-brand is Crimson in dark),
     draws the contactless waves in Chalk, and outlines the Obsidian card so it reads on the dark ground. */
  [data-theme="dark"] .brand { fill:var(--on-brand); }
  [data-theme="dark"] .wave { stroke:var(--brand); }
  [data-theme="dark"] .night { stroke:var(--line-strong); stroke-width:1; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand { fill:var(--on-brand); }
    :root:not([data-theme="light"]) .wave { stroke:var(--brand); }
    :root:not([data-theme="light"]) .night { stroke:var(--line-strong); stroke-width:1; }
  }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      brand (Crimson Deep) 272×280 slab bleeding off top and right · night (Obsidian) 192×120 card bleeding off the top · surface-raised (White) 192×144 card · accent (Signal Red) 16px dot once, small because it only signs · ground surface-sunken (Chalk), ≈40% of 960×288
  arrangement one tall Crimson slab with two payment-card satellites stacked on its left, as the Figma pages pair Crimson sections with Chalk and White cards
  pattern     a literal motif, from "built for money" and payment cards: contactless waves (three arcs at a space-4 pitch) cut into the slab in on-brand, card-number groups as 8px pills (space-2) in on-night and brand
  scales      sides in space-2 multiples; gutters space-4; arc pitch space-4; pills rx 4 (radius-xs); card corners 16 (radius-lg)
-->
<rect class="night" x="16" y="-16" width="192" height="120" rx="16"/>
<rect class="pill-ground" x="40" y="72" width="40" height="8" rx="4"/>
<rect class="pill-ground" x="88" y="72" width="40" height="8" rx="4"/>
<rect class="pill-ground" x="136" y="72" width="24" height="8" rx="4"/>
<rect class="raised" x="16" y="120" width="192" height="144" rx="16"/>
<rect class="pill-brand" x="40" y="216" width="40" height="8" rx="4"/>
<rect class="pill-brand" x="88" y="216" width="40" height="8" rx="4"/>
<rect class="pill-brand" x="136" y="216" width="40" height="8" rx="4"/>
<rect class="pill-brand" x="40" y="144" width="32" height="24" rx="4"/>
<circle class="accent" cx="184" cy="156" r="8"/>
<rect class="brand" x="224" y="-16" width="272" height="280" rx="16"/>
<path class="wave" d="M320 104 a24 24 0 0 1 0 48"/>
<path class="wave" d="M336 88 a40 40 0 0 1 0 80"/>
<path class="wave" d="M352 72 a56 56 0 0 1 0 112"/>
</svg>
</div>
<div class="words">
<p class="eyebrow"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><line class="spark" x1="24" y1="14" x2="24" y2="4.5"/><line class="petal" x1="32.66" y1="19" x2="40.89" y2="14.25"/><line class="petal" x1="32.66" y1="29" x2="40.89" y2="33.75"/><line class="petal" x1="24" y1="34" x2="24" y2="43.5"/><line class="petal" x1="15.34" y1="29" x2="7.11" y2="33.75"/><line class="petal" x1="15.34" y1="19" x2="7.11" y2="14.25"/></svg>areeba</p>
<h1 class="name">Asterisk 4</h1>
<p class="tag">areeba's design system: web and React Native apps, SaaS portals and card machines.</p>
</div>
</div>
</body>
</html>
