# Builds Storybook on every pull request and deploys it to GitHub Pages from main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Storybook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tokens.css is up to date with tokens.json
        run: |
          python3 scripts/build-tokens.py
          git diff --exit-code tokens.css
      - name: Check generated files (bundle, platform tokens, native icons) and the 1000-line limit
        run: |
          npm run check
          node scripts/build-platform-tokens.mjs --check
          node scripts/build-native-icons.mjs --check
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
